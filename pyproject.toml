[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wolf-rayet-detector"
version = "0.1.0"
description = "Reproducible pipelines for building Wolf-Rayet reference samples and candidate datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "astropy>=6.0",
  "astroquery>=0.4.7",
  "beautifulsoup4>=4.12",
  "duckdb>=1.0",
  "lxml>=5.0",
  "imbalanced-learn>=0.12",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "polars>=1.0",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
  "scikit-optimize>=0.10",
  "scikit-learn>=1.4",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
modeling = [
  "xgboost>=2.0",
]
viz = [
  "streamlit>=1.57,<1.58",
  "altair>=5.0",
]

[project.scripts]
wr-detector = "wr_detector.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
