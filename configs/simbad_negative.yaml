paths_config: configs/paths.yaml
catalogs_config: configs/catalogs.yaml
filters_config: configs/filters.yaml

simbad:
  object_types:
    - EclBin
    - YSO
    - EmLine*
    - Be*
    - TTauri*
    - LongPeriodV*
    - Eruptive*
    - BlueSG
    - C*
    - HighMassXBin
    - RGB*
    - AGB*
  require_gaia_dr3_id: true
  row_limit:
  exclude_wolf_rayet_patterns:
    - WolfRayet
    - WR*
    - "Wolf-Rayet"

crossmatch:
  vizier_radius_arcsec: 5.0
  duplicate_primary_radius_arcsec: 1.5
  duplicate_secondary_radius_arcsec: 1.0
