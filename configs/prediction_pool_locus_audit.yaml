prediction_pool_config: configs/prediction_pool.yaml
models_config: configs/models.yaml

run_id: audit_20260722_exact_union_spatial_v1
reuse_existing_acquisitions: true

# Extra Gaia DR3 fields are audit-only. ag_gspphot is treated as an incomplete
# line-of-sight proxy, never as a label or a required pool feature.
extra_gaia_columns:
  galactic_l: l
  galactic_b: b
  ag_gspphot: ag_gspphot
  ebpminrp_gspphot: ebpminrp_gspphot

