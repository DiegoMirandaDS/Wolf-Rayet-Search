exact_locus_variants:
  - strict_photometry
  - strict_parallax_soft
  - strict_poe_2
  - strict_poe_3
  - relaxed_photometry
  - relaxed_parallax_soft
  - relaxed_poe_2
  - relaxed_poe_3

magnitude_bins: [0, 12, 14, 16, 18, 30]
magnitude_labels: ["G<12", "12<=G<14", "14<=G<16", "16<=G<18", "G>=18"]

legacy_lineage:
  raw_dir: data/raw/prediction_pool
  partial_db: data/databases/prediction_pool_5x5_partial.duckdb
  main_db: data/databases/prediction_pool.duckdb

outputs:
  raw_dir_template: data/raw/prediction_pool_locus_audit/{run_id}
  data_dir_template: data/processed/prediction_pool_locus_audit/{run_id}
  report_dir_template: reports/analysis/prediction_pool_locus_audit/{run_id}
